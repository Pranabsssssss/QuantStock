<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#05070D" />
    </linearGradient>

    <!-- Emerald / Cyan Gradient for Stock Wave -->
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Secondary Violet Glow -->
    <linearGradient id="glow-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Inner Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#accent-grad)" stroke-opacity="0.25" stroke-width="8" />

  <!-- Quant Stock Bar Chart Glow Effect -->
  <g filter="url(#neon-glow)">
    <!-- Bar 1 -->
    <rect x="110" y="270" width="48" height="130" rx="12" fill="url(#accent-grad)" opacity="0.6" />
    <!-- Bar 2 -->
    <rect x="182" y="210" width="48" height="190" rx="12" fill="url(#accent-grad)" opacity="0.8" />
    <!-- Bar 3 -->
    <rect x="254" y="150" width="48" height="250" rx="12" fill="url(#accent-grad)" opacity="0.9" />
    <!-- Bar 4 (Peak) -->
    <rect x="326" y="100" width="48" height="300" rx="12" fill="url(#accent-grad)" />
  </g>

  <!-- Upward Trend Arrow & Stock Line -->
  <path d="M 96 320 Q 200 280 270 190 L 370 90" fill="none" stroke="#67E8F9" stroke-width="20" stroke-linecap="round" />
  
  <!-- Arrowhead -->
  <path d="M 310 90 H 370 V 150" fill="none" stroke="#67E8F9" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

  <!-- AI Spark / Diamond Node at Peak -->
  <polygon points="370,60 382,85 407,97 382,109 370,134 358,109 333,97 358,85" fill="#A7F3D0" />
</svg>
